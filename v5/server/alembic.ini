# Configuration for the `alembic` CLI, which is only used during development to autogenerate a
# revision after changing src/lnt_v5/tables.py:
#
#     cd v5/server && uv run --env-file ../.env alembic revision --autogenerate -m "what changed"
#
# The server never reads this file. It builds an equivalent configuration in migrate.py, pointed
# at the packaged migrations directory, because the Docker image installs the package into
# site-packages and this file is not copied there.
#
# There is deliberately no sqlalchemy.url here: env.py takes the database from DATABASE_URL, so
# there is one way to say which database is meant, and no second copy of a password.

[alembic]
script_location = src/lnt_v5/migrations
prepend_sys_path = src

# Revisions are numbered sequentially rather than randomly, so that reading `ls versions/` tells
# you the order. Alembic itself only cares about the down_revision chain; rename the file and the
# `revision` string it generates to follow the sequence.
file_template = %%(rev)s_%%(slug)s
