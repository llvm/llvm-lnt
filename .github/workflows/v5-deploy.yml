#
# Deploy the v5 stack. Manual only: pick an environment and the image tag produced by the v5 Test
# workflow, and apply. Each environment is a GitHub environment holding that deployment's settings.
#

name: v5 Deploy
run-name: "v5 Deploy ${{ inputs.app_image_tag }} to ${{ inputs.environment }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      # Keep in sync with the `environments` in v5/deployment/bootstrap/ci.tf.
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - test
          - production
      app_image_tag:
        description: "Tag of the ghcr.io/llvm/llvm-lnt-v5 image to deploy"
        required: true
        type: string

concurrency:
  group: v5-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.V5_DOMAIN }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: v5/deployment/main
    steps:
      # Deploying replaces the instance, so a tag that doesn't exist would leave the environment
      # down. That happens with a typo, or when the image is still being built or failed to build.
      - name: Check that the image exists
        working-directory: .
        env:
          IMAGE: ghcr.io/llvm/llvm-lnt-v5:${{ inputs.app_image_tag }}
        run: |
          if ! docker manifest inspect "$IMAGE" > /dev/null; then
            echo "::error::Image $IMAGE was not found. Was it pushed by the v5 Test workflow?"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.V5_AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform init
        run: terraform init

      - name: Select the Terraform workspace
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: terraform workspace select -or-create "$ENVIRONMENT"

      - name: Terraform apply
        env:
          TF_VAR_cdn: ${{ vars.V5_CDN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.V5_CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.V5_CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain: ${{ vars.V5_DOMAIN }}
          TF_VAR_app_image_tag: ${{ inputs.app_image_tag }}
        run: terraform apply -auto-approve

      # The app migrates the database before it serves, and a migration that rewrites a large table
      # can take a while, so be generous.
      - name: Wait for /healthz
        env:
          DOMAIN: ${{ vars.V5_DOMAIN }}
        run: |
          deadline=$((SECONDS + 30 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl --silent --fail --max-time 10 "https://${DOMAIN}/healthz" | grep -q '"ok":true'; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Server not healthy after 30 minutes. The app may still be migrating the database, or failing to start."
          exit 1
