#
# Build and test the v5 app, then build the Docker image and push it (only on pushes to main).
#
# v4 lives in the same repository, so this is scoped to v5/ to keep it off unrelated PRs.
#

name: v5 Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/llvm/llvm-lnt-v5

jobs:
  test-client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:client
      - run: npm run typecheck:tools
      - run: npm run lint:client
      - run: npm run lint:tools
      - run: npm run test:client

  test-server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v5
    # The server tests run against a real PostgreSQL, creating a throwaway database of their own
    # per run.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lnt
          POSTGRES_PASSWORD: lnt
          POSTGRES_DB: lnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lnt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: v5/server/uv.lock

      # --frozen so a lockfile that has drifted from pyproject.toml fails here rather than
      # silently resolving something no one has tested.
      - run: uv sync --frozen
        working-directory: v5/server

      # The client's API types are generated from the server's OpenAPI document, which takes both
      # toolchains, so this is the job that can tell when the checked-in types are stale. First,
      # since it is quick.
      - run: npm ci
      - run: npm run check:api

      - run: npm run lint:server
      - run: npm run typecheck:server
      - run: npm run test:server

  test-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v5
    # The end-to-end tests start the server themselves, against a throwaway database they create on
    # this PostgreSQL and drop afterwards.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lnt
          POSTGRES_PASSWORD: lnt
          POSTGRES_DB: lnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lnt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: v5/server/uv.lock

      - run: uv sync --frozen
        working-directory: v5/server
      - run: npm ci
      # The browser is not cached: restoring it takes about as long as downloading it, and its
      # system dependencies have to be installed either way.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            v5/e2e/playwright-report
            v5/e2e/test-results
            v5/e2e/server.log
          retention-days: 14

  build-docker:
    needs: [test-client, test-server, test-e2e]
    # The app runs on arm64 in EC2, so we use native arm64 GitHub runners since that simplifies
    # building and testing the Docker image.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE:${{ steps.tag.outputs.tag }}" \
                       --tag "$IMAGE:latest" v5

      - name: Integration tests
        run: v5/integration-tests/run.sh "$IMAGE:${{ steps.tag.outputs.tag }}"

      # Only done when pushing to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE:latest"
