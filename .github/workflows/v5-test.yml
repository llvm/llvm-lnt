#
# Test the v5 app, build its Docker image and test the image, then push the image (only on pushes
# to main, once every test has passed).
#
# The image is built once, and handed to the jobs that test it and push it as an artifact rather
# than through the registry, which PRs from forks cannot push to.
#

name: v5 Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/llvm/llvm-lnt-v5

jobs:
  test-client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:client
      - run: npm run typecheck:tools
      - run: npm run lint:client
      - run: npm run lint:tools
      - run: npm run test:client

  test-server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v5
    # The server tests run against a real PostgreSQL, creating a throwaway database of their own
    # per run.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lnt
          POSTGRES_PASSWORD: lnt
          POSTGRES_DB: lnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lnt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: v5/server/uv.lock

      # --frozen so a lockfile that has drifted from pyproject.toml fails here rather than
      # silently resolving something no one has tested.
      - run: uv sync --frozen
        working-directory: v5/server

      # The client's API types are generated from the server's OpenAPI document, which takes both
      # toolchains, so this is the job that can tell when the checked-in types are stale. First,
      # since it is quick.
      - run: npm ci
      - run: npm run check:api

      - run: npm run lint:server
      - run: npm run typecheck:server
      - run: npm run test:server

  build-docker:
    # The app runs on arm64 in EC2, so the image is built, and tested, on native arm64 runners.
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE:${{ steps.tag.outputs.tag }}" \
                       --tag "$IMAGE:latest" \
                       --build-arg LNT_REVISION="${{ steps.tag.outputs.tag }}" v5
          docker save --output "$RUNNER_TEMP/image.tar" \
                      "$IMAGE:${{ steps.tag.outputs.tag }}" "$IMAGE:latest"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          # Long enough to re-run failed jobs for a few days.
          retention-days: 3

  test-integration:
    needs: build-docker
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.build-docker.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"

      - run: LNT_V5_IMAGE="$IMAGE:$TAG" npm run test:integration
        working-directory: v5

  test-e2e:
    needs: build-docker
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.build-docker.outputs.tag }}
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - run: npm ci
      # The browser is not cached: restoring it takes about as long as downloading it, and its
      # system dependencies have to be installed either way.
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"

      - run: LNT_V5_IMAGE="$IMAGE:$TAG" npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            v5/e2e/playwright-report
            v5/e2e/test-results
            v5/e2e/server.log
          retention-days: 14

  # Runs on PRs too, up to the push, so that they exercise handing the image over.
  push-docker:
    needs: [build-docker, test-client, test-server, test-integration, test-e2e]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.build-docker.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}
      - run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker image inspect "$IMAGE:$TAG" "$IMAGE:latest" > /dev/null

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
