#
# Build and test the v5 app, then build the Docker image and push it (only on pushes to main).
#
# v4 lives in the same repository, so this is scoped to v5/ to keep it off unrelated PRs.
#

name: v5 Test

on:
  pull_request:
    paths:
      - 'v5/**'
      - '.github/workflows/v5-test.yml'
  push:
    branches: [main]
    paths:
      - 'v5/**'
      - '.github/workflows/v5-test.yml'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/llvm/llvm-lnt-v5

jobs:
  test-npm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: v5/.nvmrc
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  build-docker:
    needs: [test-npm]
    # The app runs on arm64 in EC2, so we use native arm64 GitHub runners since that simplifies
    # building and testing the Docker image.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lnt
          POSTGRES_PASSWORD: lnt
          POSTGRES_DB: lnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lnt"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE:${{ steps.tag.outputs.tag }}" \
                       --tag "$IMAGE:latest" v5

      - name: Run container
        run: |
          docker run --detach --init --name lnt-v5 --network host \
                     --env DATABASE_URL=postgres://lnt:lnt@localhost:5432/lnt \
                     --env PORT=3000 \
                     "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/healthz | grep -q '"ok":true'; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy"
          exit 1

      - name: Check the client shell is served
        run: curl --silent --fail http://localhost:3000/ | grep -q '<title>LNT</title>'

      - name: Check deep links resolve to the client
        run: curl --silent --fail http://localhost:3000/suites/nts | grep -q '<title>LNT</title>'

      - name: Check unmatched API routes 404 as JSON rather than the client
        run: |
          body=$(curl --silent http://localhost:3000/api/does-not-exist)
          echo "$body" | grep -q '"code":"not_found"'

      - name: Container logs
        if: always()
        run: docker logs lnt-v5

      # Only done when pushing to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE:latest"
