#
# Nginx configuration for the production deployment, terminating TLS.
#
# This is the production counterpart to docker/nginx.conf (which stays HTTP-only
# for local development). The certificate it serves is a Cloudflare Origin CA
# certificate, which is trusted by Cloudflare but *not* by browsers. All browser
# traffic is expected to arrive through the Cloudflare proxy, which presents its
# own publicly-trusted certificate to the visitor:
#
#   visitor --https(Cloudflare cert)--> Cloudflare --https(Origin CA)--> nginx --> gunicorn
#
# For this to work, the domain's SSL/TLS mode in Cloudflare must be set to
# "Full (strict)" so that Cloudflare actually validates the origin certificate.
#

upstream lnt_app {
    # Connect to gunicorn running in the `webserver` container
    server webserver:8000;
}

# For requests arriving through Cloudflare, $remote_addr is a Cloudflare edge
# address and the real visitor IP is in CF-Connecting-IP. Fall back to
# $remote_addr for requests that reach the instance directly.
map $http_cf_connecting_ip $lnt_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

#
# The directives below sit in the `http` context (files in conf.d are included
# from within it) so that both server blocks inherit them. Note that if a
# `location` ever defines its own add_header or proxy_set_header, it stops
# inheriting the ones here and must repeat them.
#

client_max_body_size 100M;

# Basic security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# Headers for proper proxying
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $lnt_real_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeouts (we match gunicorn's timeout)
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# Buffering
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;

# The Cloudflare Origin CA certificate and key, put in place by cloud-init and
# bind-mounted into the container by deployment/compose.prod.yaml.
ssl_certificate     /etc/nginx/tls/origin.pem;
ssl_certificate_key /etc/nginx/tls/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    location / {
        proxy_pass http://lnt_app;
    }
}

server {
    # Plain HTTP is deliberately still served rather than redirected to HTTPS.
    #
    # With Cloudflare proxying the domain, this port is only reachable by
    # connecting to the instance's IP address directly, so it acts as a debugging
    # escape hatch (and a way to submit payloads larger than Cloudflare's
    # request body limit). Redirecting to HTTPS here would only lead to a
    # certificate warning, since the Origin CA certificate is not browser-trusted
    # and is not issued for the bare IP address.
    #
    # Browser-facing http -> https upgrades are handled by Cloudflare's
    # "Always Use HTTPS" setting, at the edge.
    listen 80;
    listen [::]:80;

    location / {
        proxy_pass http://lnt_app;
    }
}
